%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/espressif,esp32-uhci-uart.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32 HP UART with UHCI DMA

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

description: |
  One UHCI bridge connects to a selected HP UART.
  The serial alias number selects the corresponding hardware UART. A single
  AHB GDMA pair services both transmit and receive for the bridge.

allOf:
  - $ref: serial.yaml#
  - if:
      properties:
        compatible:
          const: espressif,esp32p4-uhci-uart
    then:
      properties:
        reg:
          items:
            - description: HP UART registers
            - description: UHCI bridge registers
        reg-names:
          items:
            - const: uart
            - const: uhci
      required:
        - resets
        - reset-names
    else:
      properties:
        reg:
          items:
            - description: HP UART registers
            - description: UHCI bridge registers
            - description: UHCI clock and reset register
            - description: DMA buffers in internal SRAM
        reg-names:
          items:
            - const: uart
            - const: uhci
            - const: clkrst
            - const: dma-buf
        resets: false
        reset-names: false

properties:
  compatible:
    enum:
      - espressif,esp32p4-uhci-uart
      - espressif,esp32s31-uhci-uart

  clocks:
    items:
      - description: UART APB and functional clock
      - description: UHCI bus clock

  clock-names:
    items:
      - const: uart
      - const: bus

  resets:
    items:
      - description: HP UART reset
      - description: UHCI bridge reset

  reset-names:
    items:
      - const: uart
      - const: uhci

  dmas:
    maxItems: 1
    description: AHB GDMA pair with UHCI0 trigger selector.

  dma-names:
    const: tx

  espressif,irda-mode:
    type: boolean
    description: Enable the HP UART IrDA encoder and decoder.

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - dmas
  - dma-names

unevaluatedProperties: false
