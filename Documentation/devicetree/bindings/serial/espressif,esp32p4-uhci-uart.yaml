%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/espressif,esp32p4-uhci-uart.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-P4 HP UART with UHCI DMA

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

description: |
  The ESP32-P4 has one UHCI bridge, selectable to one of the five HP UARTs.
  The serial alias number selects the corresponding hardware UART. A single
  AHB GDMA pair services both transmit and receive for the bridge.

allOf:
  - $ref: serial.yaml#

properties:
  compatible:
    const: espressif,esp32p4-uhci-uart

  reg:
    items:
      - description: HP UART registers
      - description: UHCI bridge registers

  reg-names:
    items:
      - const: uart
      - const: uhci

  clocks:
    items:
      - description: UART APB and functional clock
      - description: UHCI bus clock

  clock-names:
    items:
      - const: uart
      - const: bus

  resets:
    items:
      - description: HP UART reset
      - description: UHCI bridge reset

  reset-names:
    items:
      - const: uart
      - const: uhci

  dmas:
    maxItems: 1
    description: AHB GDMA pair with UHCI0 trigger selector.

  dma-names:
    const: tx

  espressif,irda-mode:
    type: boolean
    description: Enable the HP UART IrDA encoder and decoder.

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - resets
  - reset-names
  - dmas
  - dma-names

unevaluatedProperties: false
