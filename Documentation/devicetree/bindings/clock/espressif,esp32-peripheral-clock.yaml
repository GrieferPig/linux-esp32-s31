%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/espressif,esp32-peripheral-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ESP32-P4 rev1 peripheral clock and reset subset

maintainers:
  - GrieferPig <noreply@example.com>

description: |
  The I2C1, GPSPI2, IOMUX, SDMMC, high-speed USB and Ethernet clocks on ESP32-P4 hw_ver1
  and the I2C1 and GPSPI2 reset controls. Clock and reset identifiers are in
  dt-bindings/clock/esp32p4-peripheral-clock.h. I2C1 and GPSPI2 use XTAL.
  I2S0 takes XTAL through its fractional MCLK divider. LEDC uses XTAL.
  SDMMC uses PLL_F160M and requires the additional low-power reset register.

properties:
  compatible:
    const: espressif,esp32p4-rev1-peripheral-clock

  reg:
    minItems: 1
    items:
      - description: High-performance clock and reset block
      - description: Low-power SDMMC and EMAC reset register
      - description: Low-power HP pad clock control register
      - description: High-performance system GMAC mode register
      - description: Low-power clock source selection register

  espressif,lpperi:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: LP peripheral clock select, gate and reset registers.

  clocks:
    minItems: 1
    items:
      - description: Crystal reference
      - description: PLL_F160M reference for SDMMC
      - description: External 50 MHz RMII reference
      - description: PARLIO clock at the external RX pad

  '#clock-cells':
    const: 1

  '#reset-cells':
    const: 1

required:
  - compatible
  - reg
  - clocks
  - '#clock-cells'
  - '#reset-cells'

additionalProperties: false
