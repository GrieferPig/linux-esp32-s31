%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/espressif,esp32s31-clk.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 clock and reset controller

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

description: |
  The HP clock/reset block contains the boot clock-tree hand-off, peripheral
  source muxes, dividers, gates and reset controls. CPLL, BBPLL and MPLL are
  critical while Linux executes from flash and PSRAM, so the provider exposes
  them read-only.

properties:
  compatible:
    const: espressif,esp32s31-clock

  reg:
    minItems: 5
    maxItems: 5

  reg-names:
    items:
      - const: hp-sys-clkrst
      - const: hp-system
      - const: cnnt-sys
      - const: hp-alive-sys
      - const: lp-aon-clkrst

  '#clock-cells':
    const: 1

  '#reset-cells':
    const: 1

required:
  - compatible
  - reg
  - reg-names
  - '#clock-cells'
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    clock-controller@20587000 {
        compatible = "espressif,esp32s31-clock";
        reg = <0x20587000 0x1000>, <0x20586000 0x1000>,
              <0x20359000 0x1000>, <0x20589000 0x1000>,
              <0x20701000 0x1000>;
        reg-names = "hp-sys-clkrst", "hp-system", "cnnt-sys",
                    "hp-alive-sys", "lp-aon-clkrst";
        #clock-cells = <1>;
        #reset-cells = <1>;
    };
...
