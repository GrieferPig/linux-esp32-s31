%YAML 1.2
---
$id: http://devicetree.org/schemas/pwm/espressif,esp32s31-pwm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 LEDC and motor-control PWM controllers

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

properties:
  compatible:
    enum:
      - espressif,esp32s31-ledc
      - espressif,esp32s31-mcpwm

  reg:
    minItems: 1
    maxItems: 2

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  '#pwm-cells':
    const: 3

  espressif,fade-time-ms:
    description: LEDC blocking fade duration applied to duty changes.
    minimum: 1
    maximum: 60000

  espressif,gamma-correction:
    description: Use the LEDC gamma RAM for a quadratic brightness curve.
    type: boolean

  espressif,fault-mask:
    description: MCPWM GPIO fault inputs that trigger one-shot force-low.
    minimum: 0
    maximum: 7

  espressif,fault-active-high-mask:
    description: Polarity mask for the enabled MCPWM GPIO fault inputs.
    minimum: 0
    maximum: 7

  espressif,sync-inputs:
    description: MCPWM timer sync selectors, one for each of three timers.
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 3
    maxItems: 3
    items:
      minimum: 0
      maximum: 6

  espressif,sync-phases:
    description: MCPWM timer phase values loaded by a sync edge.
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 3
    maxItems: 3
    items:
      maximum: 65535

required:
  - compatible
  - reg
  - clocks
  - '#pwm-cells'

allOf:
  - $ref: pwm.yaml#
  - if:
      properties:
        compatible:
          const: espressif,esp32s31-ledc
    then:
      properties:
        reg:
          minItems: 2
          maxItems: 2
      allOf:
        - not:
            anyOf:
              - required: [espressif,fault-mask]
              - required: [espressif,fault-active-high-mask]
              - required: [espressif,sync-inputs]
              - required: [espressif,sync-phases]
    else:
      properties:
        reg:
          maxItems: 1
      allOf:
        - not:
            anyOf:
              - required: [espressif,fade-time-ms]
              - required: [espressif,gamma-correction]

unevaluatedProperties: false

examples:
  - |
    pwm@20392000 {
        compatible = "espressif,esp32s31-ledc";
        reg = <0x20392000 0x600>, <0x20586208 0x4>;
        clocks = <&clkc 1>;
        #pwm-cells = <3>;
        espressif,fade-time-ms = <250>;
        espressif,gamma-correction;
    };
...
