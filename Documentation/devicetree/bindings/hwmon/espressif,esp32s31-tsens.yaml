%YAML 1.2
---
$id: http://devicetree.org/schemas/hwmon/espressif,esp32s31-tsens.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 and ESP32-P4 on-chip temperature sensor

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

properties:
  compatible:
    enum:
      - espressif,esp32s31-tsens
      - espressif,esp32p4-tsens

  reg:
    minItems: 1
    maxItems: 4

  reg-names:
    minItems: 1
    maxItems: 4

  espressif,lpperi:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: ESP32-P4 LP peripheral clock and reset registers.

  interrupts:
    maxItems: 1

  espressif,analog-i2c:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Shared ESP32-P4 internal analog sensor register bus.

  analog-supply:
    description: Shared analog register-I2C power switch.

required:
  - compatible
  - reg
  - reg-names
  - interrupts
allOf:
  - if:
      properties:
        compatible:
          const: espressif,esp32s31-tsens
    then:
      properties:
        reg:
          minItems: 2
          maxItems: 2
        reg-names:
          items:
            - const: tsens
            - const: clkrst
      required:
        - analog-supply
    else:
      if:
        required:
          - espressif,lpperi
      then:
        if:
          required:
            - espressif,analog-i2c
        then:
          properties:
            reg:
              maxItems: 1
            reg-names:
              items:
                - const: tsens
        else:
          properties:
            reg:
              minItems: 2
              maxItems: 2
            reg-names:
              items:
                - const: tsens
                - const: analog-i2c
        required:
          - analog-supply
      else:
        properties:
          reg:
            minItems: 4
          reg-names:
            items:
              - const: tsens
              - const: clkrst
              - const: analog-i2c
              - const: analog-power
          analog-supply: false

additionalProperties: false

examples:
  - |
    temperature-sensor@20818000 {
        compatible = "espressif,esp32s31-tsens";
        reg = <0x20818000 0x2c>, <0x20710030 0x4>;
        reg-names = "tsens", "clkrst";
        interrupts = <150 4>;
    };
...
