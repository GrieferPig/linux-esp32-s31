%YAML 1.2
---
$id: http://devicetree.org/schemas/hwmon/espressif,esp32s31-tsens.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 and ESP32-P4 on-chip temperature sensor

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

properties:
  compatible:
    enum:
      - espressif,esp32s31-tsens
      - espressif,esp32p4-tsens

  reg:
    minItems: 2
    items:
      - description: Temperature sensor register block
      - description: LP temperature sensor clock and reset registers
      - description: LP analog I2C master registers
      - description: Power-management register for the analog I2C master

  reg-names:
    minItems: 2
    items:
      - const: tsens
      - const: clkrst
      - const: analog-i2c
      - const: analog-power

  interrupts:
    maxItems: 1

  analog-supply:
    description: Shared analog register-I2C power switch.

required:
  - compatible
  - reg
  - reg-names
  - interrupts
allOf:
  - if:
      properties:
        compatible:
          const: espressif,esp32s31-tsens
    then:
      properties:
        reg:
          maxItems: 2
        reg-names:
          maxItems: 2
      required:
        - analog-supply
    else:
      properties:
        reg:
          minItems: 4
        reg-names:
          minItems: 4
        analog-supply: false

additionalProperties: false

examples:
  - |
    temperature-sensor@20818000 {
        compatible = "espressif,esp32s31-tsens";
        reg = <0x20818000 0x2c>, <0x20710030 0x4>;
        reg-names = "tsens", "clkrst";
        interrupts = <150 4>;
    };
...
