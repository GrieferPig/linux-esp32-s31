%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/espressif,esp32s31-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 pin controller and GPIO

maintainers:
  - Max Filippov <jcmvbkbc@gmail.com>

description: |
  ESP32-S31 has 60 bonded GPIO pads in the GPIO0 through GPIO61 number
  space. GPIO29 and GPIO41 are unbonded. Each pad has an IO_MUX function
  selector and can also connect to peripheral inputs and outputs through the
  GPIO matrix. The controller provides GPIO data, direction, pad electrical
  configuration and per-pin interrupts through four aggregate outputs. This
  binding uses aggregate output zero.

  Pin configuration nodes are children of a pinctrl state node. Their pinmux
  property consists of cells built with ESP32S31_IOMUX(),
  ESP32S31_IOMUX_IN(), ESP32S31_MATRIX_IN(), ESP32S31_MATRIX_OUT(), or
  ESP32S31_GPIO() from
  dt-bindings/pinctrl/esp32s31-pinmux.h. A group may mix those cell types and
  may contain both input and output routes for bidirectional peripherals.

properties:
  compatible:
    const: espressif,esp32s31-pinctrl

  reg:
    minItems: 3
    maxItems: 3

  reg-names:
    items:
      - const: gpio
      - const: iomux
      - const: cnnt-pad-ctrl

  gpio-controller: true

  '#gpio-cells':
    const: 2

  interrupt-controller: true

  '#interrupt-cells':
    const: 2

  interrupts:
    maxItems: 1

$defs:
  esp32s31-pin-group:
    type: object
    additionalProperties: false

    properties:
      pinmux:
        $ref: /schemas/types.yaml#/definitions/uint32-array
        minItems: 1
        description: Encoded IO_MUX and GPIO matrix operations.

      bias-disable: true
      bias-pull-up: true
      bias-pull-down: true
      input-enable: true
      input-disable: true
      input-schmitt-enable: true
      input-debounce:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: A nonzero value enables the fixed hardware glitch filter.
      drive-open-drain: true
      drive-push-pull: true
      drive-strength:
        $ref: /schemas/types.yaml#/definitions/uint32
        enum: [5, 10, 20, 40]
        description: Approximate pad drive strength in mA.
      output-high: true
      output-low: true

    required:
      - pinmux

patternProperties:
  '-pins$':
    type: object
    additionalProperties: false
    patternProperties:
      '-pins$':
        $ref: '#/$defs/esp32s31-pin-group'

required:
  - compatible
  - reg
  - reg-names
  - gpio-controller
  - '#gpio-cells'
  - interrupt-controller
  - '#interrupt-cells'
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/pinctrl/esp32s31-pinmux.h>

    pinctrl@20583000 {
        compatible = "espressif,esp32s31-pinctrl";
        reg = <0x20583000 0x1000>, <0x20582000 0x1000>,
              <0x20588000 0x1000>;
        reg-names = "gpio", "iomux", "cnnt-pad-ctrl";
        gpio-controller;
        #gpio-cells = <2>;
        interrupt-controller;
        #interrupt-cells = <2>;
        interrupts = <18 61 IRQ_TYPE_LEVEL_HIGH>;

        uart-pins {
            tx-pins {
                pinmux = <ESP32S31_MATRIX_OUT(20, 10, 0)>;
                drive-strength = <20>;
            };
            rx-pins {
                pinmux = <ESP32S31_MATRIX_IN(21, 10, 0)>;
                bias-pull-up;
                input-enable;
            };
        };
    };
...
