%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/waveshare,esp32p4-wifi6-dev-kit-peripheral-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Waveshare ESP32-P4-WIFI6-DEV-KIT rev1 peripheral pin groups

maintainers:
  - GrieferPig <noreply@example.com>

description: |
  Board pin groups for I2C1, GPSPI2, SDMMC, Ethernet, I2S0 and PCNT on the ESP32-P4
  hw_ver1 GPIO matrix and IO MUX. Board-owned GPIO ranges may be exported.

properties:
  compatible:
    const: waveshare,esp32p4-wifi6-dev-kit-peripheral-pinctrl

  reg:
    items:
      - description: GPIO matrix
      - description: IO_MUX pads

  clocks:
    maxItems: 1
    description: IOMUX clock

  gpio-controller: true

  '#gpio-cells':
    const: 2

  gpio-ranges:
    maxItems: 1

  gpio-reserved-ranges: true

patternProperties:
  '^(i2c1|gpspi2|sdmmc0|sdmmc1|emac-rmii|emac-mdio|i2s0|pcnt0|ledc0|mcpwm0|mcpwm1|rmt-loopback|twai[0-2]-loopback)-pins$':
    type: object
    properties:
      function:
        enum: [i2c1, gpspi2, sdmmc0, sdmmc1, emac-rmii, emac-mdio, i2s0, pcnt0, ledc0,
               mcpwm0, mcpwm1, rmt-loopback, twai0-loopback, twai1-loopback,
               twai2-loopback]
    required:
      - function
    additionalProperties: false

required:
  - compatible
  - reg
  - clocks

additionalProperties: false
