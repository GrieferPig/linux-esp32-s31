%YAML 1.2
---
$id: http://devicetree.org/schemas/counter/espressif,esp32-rtc-timer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32 RTC timers

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

description:
  The P4 RTC timer has a free-running 48-bit counter in the always-on domain.
  The capture registers retain the current and previous hardware snapshots.

properties:
  compatible:
    enum:
      - espressif,esp32s31-rtc-timer
      - espressif,esp32p4-rtc-timer

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false
