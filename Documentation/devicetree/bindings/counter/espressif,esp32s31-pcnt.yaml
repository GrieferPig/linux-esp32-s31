%YAML 1.2
---
$id: http://devicetree.org/schemas/counter/espressif,esp32s31-pcnt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 pulse counter

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

properties:
  compatible:
    const: espressif,esp32s31-pcnt

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks

additionalProperties: false

examples:
  - |
    counter@20389000 {
        compatible = "espressif,esp32s31-pcnt";
        reg = <0x20389000 0x100>;
        interrupts = <114 4>;
        clocks = <&clkc 1>;
    };
...
