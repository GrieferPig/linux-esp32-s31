%YAML 1.2
---
$id: http://devicetree.org/schemas/counter/espressif,esp32s31-gptimer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif timer-group general-purpose timers

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

properties:
  compatible:
    enum:
      - espressif,esp32p4-gptimer
      - espressif,esp32s31-gptimer

  reg:
    minItems: 1
    items:
      - description: Timer counters and alarm compare registers
      - description: Timer-group interrupt status, enable and clear registers

  reg-names:
    items:
      - const: counters
      - const: interrupts

  interrupts:
    items:
      - description: Timer 0 alarm interrupt
      - description: Timer 1 alarm interrupt

  interrupt-names:
    items:
      - const: timer0
      - const: timer1

  clocks:
    maxItems: 1

  espressif,reserved-timer-mask:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 3
    description:
      Bit mask of timer channels reserved by firmware and therefore omitted
      from the Linux Counter device. Bit 0 selects timer 0 and bit 1 timer 1.

required:
  - compatible
  - reg
  - clocks

allOf:
  - if:
      properties:
        compatible:
          const: espressif,esp32s31-gptimer
    then:
      properties:
        reg:
          maxItems: 1
        reg-names: false
        interrupts: false
        interrupt-names: false
    else:
      dependencies:
        interrupts: [reg-names, interrupt-names]
        reg-names: [interrupts, interrupt-names]

additionalProperties: false
...
