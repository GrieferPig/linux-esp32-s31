%YAML 1.2
---
$id: http://devicetree.org/schemas/counter/espressif,esp32p4-rtc-timer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-P4 RTC timer

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

description:
  The RTC timer has one free-running 48-bit counter in the always-on domain.
  The capture registers retain the current and previous hardware snapshots.

properties:
  compatible:
    const: espressif,esp32p4-rtc-timer

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false
