%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/proximity/espressif,esp32s31-comparator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 analog comparator

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

description: |
  On-chip analog comparator exposed through IIO. The reference level
  programs the internal threshold; the driver defaults to 3 and rejects
  values above 7.

properties:
  compatible:
    const: espressif,esp32s31-comparator

  reg:
    items:
      - description: comparator registers
      - description: clock-reset registers

  reg-names:
    items:
      - const: comparator
      - const: clkrst

  interrupts:
    maxItems: 1

  espressif,reference-level:
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 3
    maximum: 7
    description: Internal reference threshold level.

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    comparator@2039a000 {
        compatible = "espressif,esp32s31-comparator";
        reg = <0x2039a000 0x400>, <0x205871b8 0x4>;
        reg-names = "comparator", "clkrst";
        interrupts = <135 IRQ_TYPE_LEVEL_HIGH>;
        espressif,reference-level = <3>;
    };
...
