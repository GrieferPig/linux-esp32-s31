%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/dac/espressif,esp32s31-dac.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 dual DAC

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

properties:
  compatible:
    const: espressif,esp32s31-dac

  reg:
    items:
      - description: DAC register block
      - description: LP DAC clock and reset register

  reg-names:
    items:
      - const: dac
      - const: clkrst

  analog-supply: true

  '#io-channel-cells':
    const: 1

required:
  - compatible
  - reg
  - reg-names
  - analog-supply
  - '#io-channel-cells'

additionalProperties: false
...
