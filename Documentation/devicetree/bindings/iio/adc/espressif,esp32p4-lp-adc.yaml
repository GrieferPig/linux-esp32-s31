%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/espressif,esp32p4-lp-adc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-P4 low-power SAR ADC

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

properties:
  compatible:
    const: espressif,esp32p4-lp-adc

  reg:
    maxItems: 1

  espressif,lpperi:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The LP peripheral clock and reset register block.

  espressif,adc-inputs:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description: |
      ADC inputs wired for analog measurements on the board. Indices 0 through
      7 select ADC1 inputs 0 through 7. Indices 8 through 13 select ADC2 inputs
      0 through 5.
    minItems: 1
    maxItems: 14
    uniqueItems: true
    items:
      maximum: 13

  espressif,analog-i2c:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Shared internal analog register bus for factory offset setup.

  nvmem-cells:
    items:
      - description: eFuse calibration layout version
      - description: ADC1 factory offset for 0 dB
      - description: ADC2 factory offset for 0 dB

  nvmem-cell-names:
    items:
      - const: otp-version
      - const: adc1-offset
      - const: adc2-offset

  analog-supply:
    description: Shared power switch for the analog register-I2C domain.

required:
  - compatible
  - reg
  - espressif,lpperi
  - espressif,adc-inputs
  - analog-supply

dependencies:
  espressif,analog-i2c:
    - nvmem-cells
    - nvmem-cell-names

additionalProperties: false
