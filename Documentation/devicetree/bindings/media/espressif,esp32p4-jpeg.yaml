%YAML 1.2
---
$id: http://devicetree.org/schemas/media/espressif,esp32p4-jpeg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-P4 JPEG codec

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

description: |
  The codec consumes compressed input and writes decoded pixels via a paired
  2D-DMA transmit and receive channel.

properties:
  compatible:
    const: espressif,esp32p4-jpeg

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  dmas:
    maxItems: 1

  dma-names:
    const: codec

required:
  - compatible
  - reg
  - clocks
  - resets
  - dmas
  - dma-names

additionalProperties: false
