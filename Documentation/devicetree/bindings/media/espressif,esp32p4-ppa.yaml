%YAML 1.2
---
$id: http://devicetree.org/schemas/media/espressif,esp32p4-ppa.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-P4 Pixel Processing Accelerator

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

description: |
  The accelerator uses a paired 2D-DMA transmit and receive channel for
  its scale, rotate and mirror engine.

properties:
  compatible:
    const: espressif,esp32p4-ppa

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  dmas:
    maxItems: 1

  dma-names:
    const: srm

required:
  - compatible
  - reg
  - clocks
  - resets
  - dmas
  - dma-names

additionalProperties: false
