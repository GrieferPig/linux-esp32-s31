%YAML 1.2
---
$id: http://devicetree.org/schemas/media/espressif,esp32s31-media.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 JPEG and PPA memory engines

maintainers:
  - GrieferPig <grieferpig@163.com>

properties:
  compatible:
    enum:
      - espressif,esp32s31-jpeg
      - espressif,esp32s31-ppa
  reg:
    minItems: 2
    maxItems: 2
  clocks:
    maxItems: 1
  resets:
    maxItems: 1
  reg-names:
    items:
      - enum: [codec, processor]
      - const: memory-power
  espressif,dma2d:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Shared DMA2D provider, including descriptor SRAM and runtime PM.

required:
  - compatible
  - reg
  - clocks
  - resets
  - reg-names
  - espressif,dma2d
additionalProperties: false
...
