%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/espressif,esp32p4-rev1-usb-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ESP32-P4 rev1 USB2 UTMI PHY

maintainers:
  - GrieferPig <noreply@example.com>

properties:
  compatible:
    const: espressif,esp32p4-rev1-usb-phy

  reg:
    items:
      - description: UTMI PHY
      - description: USB clock and reset control
      - description: USB high-speed OTG system control

  reg-names:
    items:
      - const: utmi
      - const: otg-ctrl
      - const: phy-ctrl

  clocks:
    maxItems: 1
    description: USB high-speed peripheral bus clock

  '#phy-cells':
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - '#phy-cells'

additionalProperties: false
