%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/espressif,esp32p4-rev1-usb-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ESP32-P4 rev1 USB2 UTMI PHY

maintainers:
  - GrieferPig <noreply@example.com>

properties:
  compatible:
    const: espressif,esp32p4-rev1-usb-phy

  reg:
    minItems: 2
    maxItems: 3

  reg-names:
    minItems: 2
    maxItems: 3

  espressif,otg-clkrst:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Shared USB clock/reset register, LP_CLKRST_HP_USB_CLKRST_CTRL1.

  clocks:
    maxItems: 1
    description: USB high-speed peripheral bus clock

  '#phy-cells':
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - '#phy-cells'

allOf:
  - if:
      required:
        - espressif,otg-clkrst
    then:
      properties:
        reg:
          maxItems: 2
        reg-names:
          items:
            - const: utmi
            - const: phy-ctrl
    else:
      properties:
        reg:
          minItems: 3
        reg-names:
          items:
            - const: utmi
            - const: otg-ctrl
            - const: phy-ctrl

additionalProperties: false
