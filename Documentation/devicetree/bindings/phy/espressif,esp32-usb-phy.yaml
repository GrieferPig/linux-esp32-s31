%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/espressif,esp32-usb-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32 internal USB PHYs

maintainers:
  - GrieferPig <noreply@example.com>

description: |
  The P4 full-speed OTG controller can select either internal FS/LS PHY.
  PHY 0 normally belongs to native USB Serial/JTAG. Disable Serial/JTAG
  when the OTG connector needs to use that shared transceiver.

properties:
  compatible:
    enum:
      - espressif,esp32s31-usb-phy
      - espressif,esp32p4-rev1-usb-phy
      - espressif,esp32p4-rev1-usb-fs-phy

  '#phy-cells':
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - '#phy-cells'

oneOf:
  - properties:
      compatible:
        const: espressif,esp32s31-usb-phy

      reg:
        minItems: 5
        maxItems: 5

      reg-names:
        items:
          - const: utmi
          - const: clkrst
          - const: otg-ctrl
          - const: usb-ctrl
          - const: phy-ctrl

      power-domains:
        maxItems: 1

    required:
      - power-domains
  - properties:
      compatible:
        const: espressif,esp32p4-rev1-usb-phy

      reg:
        minItems: 2
        maxItems: 3

      reg-names:
        minItems: 2
        maxItems: 3

      espressif,otg-clkrst:
        $ref: /schemas/types.yaml#/definitions/phandle
        description: Shared USB clock/reset register, LP_CLKRST_HP_USB_CLKRST_CTRL1.

      clocks:
        maxItems: 1
        description: USB high-speed peripheral bus clock

    required:
      - reg
      - reg-names
      - clocks

    allOf:
      - if:
          required:
            - espressif,otg-clkrst
        then:
          properties:
            reg:
              maxItems: 2
            reg-names:
              items:
                - const: utmi
                - const: phy-ctrl
        else:
          properties:
            reg:
              minItems: 3
            reg-names:
              items:
                - const: utmi
                - const: otg-ctrl
                - const: phy-ctrl
  - properties:
      compatible:
        const: espressif,esp32p4-rev1-usb-fs-phy

      reg:
        items:
          - description: USB_WRAP_OTG_CONF
          - description: LP_CLKRST_HP_USB_CLKRST_CTRL0
          - description: LP_SYSTEM_USB_CTRL

      reg-names:
        items:
          - const: wrap
          - const: phy-clock
          - const: phy-route

      clocks:
        maxItems: 1

      espressif,otg-clkrst:
        $ref: /schemas/types.yaml#/definitions/phandle
        description: Shared LP_CLKRST_HP_USB_CLKRST_CTRL1.

      espressif,phy-index:
        $ref: /schemas/types.yaml#/definitions/uint32
        enum: [0, 1]
        description: The internal transceiver wired to the OTG connector.

      espressif,shared-serial-jtag:
        $ref: /schemas/types.yaml#/definitions/phandle
        description: Native USB Serial/JTAG controller sharing PHY 0.

    required:
      - reg
      - reg-names
      - clocks
      - espressif,otg-clkrst
      - espressif,phy-index

unevaluatedProperties: false
