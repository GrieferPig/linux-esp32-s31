$id: http://devicetree.org/schemas/mfd/espressif,esp32-usb-clkrst.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ESP32-P4 shared USB OTG clock and reset register

maintainers:
  - GrieferPig <noreply@example.com>

properties:
