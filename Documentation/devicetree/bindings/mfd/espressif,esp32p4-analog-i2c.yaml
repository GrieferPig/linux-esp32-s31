%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/espressif,esp32p4-analog-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-P4 internal analog sensor register bus

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

description:
  The temperature sensor and SAR ADC access their calibration registers
  over this internal bus through the low-power analog I2C master.

properties:
  compatible:
    const: espressif,esp32p4-analog-i2c

  reg:
    maxItems: 1

  espressif,lpperi:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: LP peripheral clock and reset register block.

  analog-supply:
    description: Shared power switch for the internal analog sensors.

required:
  - compatible
  - reg
  - espressif,lpperi
  - analog-supply

additionalProperties: false
