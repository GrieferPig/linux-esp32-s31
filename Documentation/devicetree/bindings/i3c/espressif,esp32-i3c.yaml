%YAML 1.2
---
$id: http://devicetree.org/schemas/i3c/espressif,esp32-i3c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-P4 I3C master controller

maintainers:
  - GrieferPig <noreply@example.com>

allOf:
  - $ref: i3c.yaml#

properties:
  compatible:
    const: espressif,esp32p4-i3c

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets

unevaluatedProperties: false
