%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/espressif,esp32p4-ahb-gdma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-P4 AHB GDMA controller

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

description: |
  Three pairs of receive and transmit channels. DMA descriptors are
  allocated in coherent low SRAM while payload buffers may use PSRAM.

properties:
  compatible:
    const: espressif,esp32p4-ahb-gdma

  reg:
    maxItems: 1

  interrupts:
    items:
      - description: RX channel 0
      - description: RX channel 1
      - description: RX channel 2
      - description: TX channel 0
      - description: TX channel 1
      - description: TX channel 2

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  '#dma-cells':
    const: 2
    description: Channel pair index followed by the peripheral request number.

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets
  - '#dma-cells'

additionalProperties: false
