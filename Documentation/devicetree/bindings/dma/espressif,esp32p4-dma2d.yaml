%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/espressif,esp32p4-dma2d.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif 2D DMA memory-to-memory controller

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

description: |
  The two memory-to-memory channel pairs support linear and strided copies.
  A memory-to-memory channel does not require a peripheral DMA specifier.

properties:
  compatible:
    enum:
      - espressif,esp32p4-dma2d
      - espressif,esp32s31-dma2d

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  interrupts:
    minItems: 4
    maxItems: 4

  interrupt-names:
    items:
      - const: tx0
      - const: rx0
      - const: tx1
      - const: rx1

required:
  - compatible
  - reg
  - clocks
  - resets
  - interrupts
  - interrupt-names

additionalProperties: false
