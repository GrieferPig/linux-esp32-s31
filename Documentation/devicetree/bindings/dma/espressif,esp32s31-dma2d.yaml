%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/espressif,esp32s31-dma2d.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 two-dimensional image DMA

maintainers:
  - GrieferPig <grieferpig@163.com>

allOf:
  - $ref: dma-controller.yaml#

properties:
  compatible:
    enum:
      - espressif,esp32s31-dma2d
  reg:
    minItems: 3
    maxItems: 3
  clocks:
    maxItems: 1
  resets:
    maxItems: 1
  reg-names:
    items:
      - const: dma
      - const: descriptors
      - const: memory-power
  interrupts:
    minItems: 3
    maxItems: 3
  interrupt-names:
    items:
      - const: rx
      - const: tx
      - const: foreground
  '#dma-cells':
    const: 1
    description: Only virtual copy channel 0 is exposed; image clients use the supplier phandle.
  dma-channels:
    const: 1

required:
  - compatible
  - reg
  - clocks
  - resets
  - reg-names
  - interrupts
  - interrupt-names
  - "#dma-cells"
additionalProperties: false
...
