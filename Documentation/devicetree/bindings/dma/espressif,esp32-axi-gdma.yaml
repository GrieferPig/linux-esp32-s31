%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/espressif,esp32-axi-gdma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 and ESP32-P4 AXI GDMA controller

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

description: |
  AXI GDMA engine with three RX and three TX channels. The third register
  window on the ESP32-S31 is the 12 KiB descriptor pool in loader-reserved
  HP SRAM. The two DMA specifier cells select a channel pair and peripheral
  trigger respectively.

properties:
  compatible:
    enum:
      - espressif,esp32s31-axi-gdma
      - espressif,esp32p4-axi-gdma

  reg:
    minItems: 1
    maxItems: 3

  reg-names:
    items:
      - const: dma
      - const: clkrst
      - const: descriptors

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  interrupts:
    minItems: 6
    maxItems: 6

  interrupt-names:
    items:
      - const: rx0
      - const: rx1
      - const: rx2
      - const: tx0
      - const: tx1
      - const: tx2

  '#dma-cells':
    const: 2

  dma-channels:
    const: 3

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - '#dma-cells'

allOf:
  - if:
      properties:
        compatible:
          const: espressif,esp32p4-axi-gdma
    then:
      properties:
        reg:
          maxItems: 1
        reg-names: false
      required:
        - clocks
        - resets
    else:
      properties:
        reg:
          minItems: 3

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    dma-controller@20348000 {
        compatible = "espressif,esp32s31-axi-gdma";
        reg = <0x20348000 0x1000>, <0x20587078 0x4>,
              <0x2f072380 0x3000>;
        reg-names = "dma", "clkrst", "descriptors";
        interrupts = <48 IRQ_TYPE_LEVEL_HIGH>,
                     <49 IRQ_TYPE_LEVEL_HIGH>,
                     <50 IRQ_TYPE_LEVEL_HIGH>,
                     <51 IRQ_TYPE_LEVEL_HIGH>,
                     <52 IRQ_TYPE_LEVEL_HIGH>,
                     <53 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "rx0", "rx1", "rx2",
                          "tx0", "tx1", "tx2";
        #dma-cells = <2>;
        dma-channels = <3>;
    };
...
