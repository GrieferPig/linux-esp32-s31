%YAML 1.2
---
$id: http://devicetree.org/schemas/cache/espressif,esp32s31-cache.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 external cache controller

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

description: |
  External cache controller for flash/PSRAM designation. Cache maintenance
  itself runs through SBI calls; the devicetree node only designates the
  controller window and its instance identifier.

properties:
  compatible:
    const: espressif,esp32s31-cache

  reg:
    maxItems: 1

  espressif,icache-id:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Cache instance identifier selected by firmware.

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    cache-controller@2c000000 {
        compatible = "espressif,esp32s31-cache";
        reg = <0x2c000000 0x1000>;
        espressif,icache-id = <1>;
    };
...
