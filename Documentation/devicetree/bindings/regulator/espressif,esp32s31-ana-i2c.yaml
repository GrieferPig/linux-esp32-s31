%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/espressif,esp32s31-ana-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 shared analog register-I2C power

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

allOf:
  - $ref: regulator.yaml#

properties:
  compatible:
    const: espressif,esp32s31-ana-i2c

  reg:
    maxItems: 1

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    regulator@20704208 {
        compatible = "espressif,esp32s31-ana-i2c";
        reg = <0x20704208 0x4>;
        regulator-name = "ana-i2c";
        regulator-always-on;
    };
...
