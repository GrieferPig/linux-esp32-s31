%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/espressif,esp32p4-vo4-bypass.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ESP32-P4 VO4 regulator in 3.3 V bypass mode

maintainers:
  - GrieferPig <noreply@example.com>

allOf:
  - $ref: regulator.yaml#

properties:
  compatible:
    const: espressif,esp32p4-vo4-bypass

  reg:
    maxItems: 1
    description: VO4 control register in the power management unit

  regulator-min-microvolt:
    const: 3300000

  regulator-max-microvolt:
    const: 3300000

required:
  - compatible
  - reg
  - regulator-name
  - regulator-min-microvolt
  - regulator-max-microvolt

unevaluatedProperties: false
