%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/espressif,esp32s31-gp-ldo.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 general-purpose LDO

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

allOf:
  - $ref: regulator.yaml#

properties:
  compatible:
    const: espressif,esp32s31-gp-ldo

  reg:
    maxItems: 1

  espressif,ripple-suppression:
    type: boolean

  espressif,current-limit:
    type: boolean

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    regulator@20704218 {
        compatible = "espressif,esp32s31-gp-ldo";
        reg = <0x20704218 0x4>;
        regulator-name = "vdd-psram";
        regulator-min-microvolt = <1800000>;
        regulator-max-microvolt = <1800000>;
        regulator-always-on;
    };
...
