%YAML 1.2
---
$id: http://devicetree.org/schemas/power/espressif,esp32s31-pmu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 power management unit

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

description: |
  The PMU controls the TOP, HPALIVE, MODEMPWR, HPCPU, HPCNNT, MODEM and
  LP peripheral domains. Domains required by XIP, PSRAM, CPUs or the radio
  firmware are kept on. HPCNNT power-off is opt-in until every connectivity
  consumer is represented in the domain. Consumers without runtime PM remain
  active and safely keep the shared domain powered.

properties:
  compatible:
    const: espressif,esp32s31-pmu

  reg:
    maxItems: 1

  '#power-domain-cells':
    const: 1

  espressif,allow-hpcnnt-power-off:
    type: boolean
    description:
      Permit runtime power-off of HPCNNT. Boards must not set this until all
      enabled USB, SDMMC and Ethernet consumers have a power-domain reference.
      The domain powers off only after every attached consumer is suspended.

required:
  - compatible
  - reg
  - '#power-domain-cells'

additionalProperties: false

examples:
  - |
    power-controller@20704000 {
        compatible = "espressif,esp32s31-pmu";
        reg = <0x20704000 0x1000>;
        #power-domain-cells = <1>;
    };
...
