%YAML 1.2
---
$id: http://devicetree.org/schemas/nvmem/espressif,esp32s31-efuse.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 eFuse read window

maintainers:
  - Espressif Linux Team <linux-esp32@espressif.com>

description: |
  The ESP32-S31 exposes read-only shadow registers for its eFuse blocks. This
  binding describes a block read window and fixed NVMEM cells within it. A
  mac-base cell is byte-swapped from the native eFuse register order by the
  provider before its phandle offset argument is applied.

allOf:
  - $ref: nvmem.yaml#

properties:
  compatible:
    const: espressif,esp32s31-efuse

  reg:
    maxItems: 1

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    efuse@20715050 {
        compatible = "espressif,esp32s31-efuse";
        reg = <0x20715050 0x18>;
        read-only;

        nvmem-layout {
            compatible = "fixed-layout";
            #address-cells = <1>;
            #size-cells = <1>;

            factory_mac: mac-address@0 {
                compatible = "mac-base";
                reg = <0x0 0x6>;
                #nvmem-cell-cells = <1>;
            };
        };
    };
...
