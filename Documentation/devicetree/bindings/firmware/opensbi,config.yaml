%YAML 1.2
---
$id: http://devicetree.org/schemas/firmware/opensbi,config.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: OpenSBI runtime configuration
maintainers:
  - S31 Linux contributors <s31-linux@localhost>
description: Firmware configuration child of /chosen consumed during OpenSBI initialization.
properties:
  compatible:
    const: opensbi,config
  heap-size:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 4096
    description: OpenSBI heap size in bytes.
required:
  - compatible
additionalProperties: false
