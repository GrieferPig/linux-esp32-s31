%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/espressif,esp32-parlio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-P4 Parallel IO controller

maintainers:
  - GrieferPig <noreply@example.com>

description: |
  Parallel frame transmission and reception through AXI GDMA. The transmitter
  generates its own clock and the receiver samples on the external RX clock.
  Data lanes and clock pads are assigned with pinctrl.

properties:
  compatible:
    const: espressif,esp32p4-parlio

  reg:
    maxItems: 1

  interrupts:
    items:
      - description: Receiver FIFO interrupt
      - description: Transmitter FIFO and frame-end interrupt

  interrupt-names:
    items:
      - const: rx
      - const: tx

  clocks:
    items:
      - description: APB register and AXI peripheral interface clock gate
      - description: Receive sampling clock
      - description: Transmit bit clock
      - description: Crystal clock used to reset the receiver FIFO
      - description: Expected external receive clock

  clock-names:
    items:
      - const: bus
      - const: rx
      - const: tx
      - const: xtal
      - const: rx-pad

  resets:
    items:
      - description: Register interface
      - description: Receive clock domain
      - description: Transmit clock domain

  reset-names:
    items:
      - const: bus
      - const: rx
      - const: tx

  dmas:
    items:
      - description: Hardware RX from the peripheral to memory
      - description: Hardware TX from memory to the peripheral

  dma-names:
    items:
      - const: rx
      - const: tx

  espressif,data-width:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [1, 2, 4, 8, 16]
    description: Maximum width wired to the pads in each direction.

  clock-frequency:
    description: Requested transmit clock frequency in Hz.
    minimum: 1
    maximum: 40000000

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - resets
  - reset-names
  - dmas
  - dma-names
  - espressif,data-width
  - clock-frequency

additionalProperties: false
