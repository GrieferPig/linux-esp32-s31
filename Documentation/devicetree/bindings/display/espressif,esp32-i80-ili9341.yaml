%YAML 1.2
---
$id: http://devicetree.org/schemas/display/espressif,esp32-i80-ili9341.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ESP32-S31 LCD_CAM with an Intel 8080 ILI9341 panel

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

description:
  An ILI9341 panel connected to the LCD_CAM 8-bit Intel 8080 bus. The LCD
  transmitter fetches pixels from memory through the LCD request of AXI GDMA.
  The panel read strobe is kept deasserted. Shields with shared four-wire
  resistive touch electrodes can sample them between LCD transfers.

properties:
  compatible:
    const: espressif,esp32s31-i80-ili9341

  reg:
    items:
      - description: LCD_CAM registers
      - description: LCD_CAM-specific HP_SYS_CLKRST registers

  reg-names:
    items:
      - const: lcdcam
      - const: clkrst

  interrupts:
    maxItems: 1
    description: LCD_CAM interrupt including LCD transfer completion.

  clocks:
    items:
      - description: LCD functional clock from PLL_F160M
      - description: LCD_CAM shared core clock from PLL_F120M

  clock-names:
    items:
      - const: lcd
      - const: core

  clock-frequency:
    description: Maximum frequency of the panel write strobe in Hz.
    maximum: 15000000

  dmas:
    maxItems: 1

  dma-names:
    const: tx

  reset-gpios:
    maxItems: 1

  rd-gpios:
    maxItems: 1

  pinctrl-0: true
  pinctrl-1: true
  pinctrl-2: true
  pinctrl-3: true
  pinctrl-4: true
  pinctrl-5: true

  pinctrl-names:
    oneOf:
      - items:
          - const: default
      - items:
          - const: default
          - const: touch-detect
          - const: touch-x
          - const: touch-x-reverse
          - const: touch-y
          - const: touch-y-reverse

  io-channels:
    items:
      - description: ADC1 input on GPIO42.
      - description: ADC1 input on GPIO43.

  io-channel-names:
    items:
      - const: gpio42
      - const: gpio43

dependencies:
  io-channels: [io-channel-names, pinctrl-1, pinctrl-2, pinctrl-3, pinctrl-4, pinctrl-5]
  io-channel-names: [io-channels]

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - clock-frequency
  - dmas
  - dma-names
  - reset-gpios
  - rd-gpios
  - pinctrl-0
  - pinctrl-names

additionalProperties: false
