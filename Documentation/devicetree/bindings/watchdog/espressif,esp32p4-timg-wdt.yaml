# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/watchdog/espressif,esp32p4-timg-wdt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-P4 timer-group main watchdogs

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

allOf:
  - $ref: watchdog.yaml#

properties:
  compatible:
    const: espressif,esp32p4-timg-wdt

  reg:
    maxItems: 1
    description: Watchdog register window starting at TIMG_WDTCONFIG0.

  clocks:
    maxItems: 1
    description: Timer-group watchdog clock derived from the 40 MHz crystal.

required:
  - compatible
  - reg
  - clocks

unevaluatedProperties: false
