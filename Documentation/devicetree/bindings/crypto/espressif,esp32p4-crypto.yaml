%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/espressif,esp32p4-crypto.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-P4 AES, SHA, RSA and ECC accelerators

maintainers:
  - GrieferPig <grieferpig@users.noreply.github.com>

properties:
  compatible:
    const: espressif,esp32p4-crypto

  reg:
    items:
      - description: AES and SHA register banks
      - description: RSA/MPI register bank
      - description: ECC register bank
      - description: HP system ECC memory power control register

  reg-names:
    items:
      - const: aes-sha
      - const: rsa
      - const: ecc
      - const: ecc-power

  clocks:
    items:
      - description: AES and SHA clock
      - description: RSA/MPI clock
      - description: ECC clock

  clock-names:
    items:
      - const: aes-sha
      - const: rsa
      - const: ecc

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names

additionalProperties: false
