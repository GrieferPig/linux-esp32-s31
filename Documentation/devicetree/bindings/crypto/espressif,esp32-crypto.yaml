%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/espressif,esp32-crypto.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32 cryptographic accelerators

maintainers:
  - GrieferPig <grieferpig@users.noreply.github.com>

properties:
  compatible:
    enum:
      - espressif,esp32s31-crypto
      - espressif,esp32p4-aes-sha
      - espressif,esp32p4-crypto

required:
  - compatible
  - reg

oneOf:
  - properties:
      compatible:
        const: espressif,esp32s31-crypto

      reg:
        items:
          - description: AES, SHA, RSA and ECC accelerator registers
          - description: Clock and reset register

      reg-names:
        items:
          - const: crypto
          - const: clkrst

      dmas:
        maxItems: 1

      dma-names:
        const: sha

    required:
      - reg-names
      - dmas
      - dma-names
  - properties:
      compatible:
        const: espressif,esp32p4-aes-sha

      reg:
        maxItems: 1
        description: Combined range covering the AES and SHA register banks.

      clocks:
        maxItems: 1
        description: Clock enabling the AES and SHA register banks and engines.

    required:
      - reg
      - clocks
  - properties:
      compatible:
        const: espressif,esp32p4-crypto

      reg:
        items:
          - description: AES and SHA register banks
          - description: RSA/MPI register bank
          - description: ECC register bank
          - description: HP system ECC memory power control register

      reg-names:
        items:
          - const: aes-sha
          - const: rsa
          - const: ecc
          - const: ecc-power

      clocks:
        items:
          - description: AES and SHA clock
          - description: RSA/MPI clock
          - description: ECC clock

      clock-names:
        items:
          - const: aes-sha
          - const: rsa
          - const: ecc

    required:
      - reg
      - reg-names
      - clocks
      - clock-names

unevaluatedProperties: false
