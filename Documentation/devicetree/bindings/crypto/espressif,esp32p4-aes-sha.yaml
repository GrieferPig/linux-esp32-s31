%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/espressif,esp32p4-aes-sha.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-P4 AES and SHA accelerators

maintainers:
  - GrieferPig <grieferpig@users.noreply.github.com>

description:
  The AES and SHA accelerators occupy adjacent register banks in the P4
  cryptographic subsystem. They share clock and reset dependencies with
  other engines in the subsystem.

properties:
  compatible:
    const: espressif,esp32p4-aes-sha

  reg:
    maxItems: 1
    description: Combined range covering the AES and SHA register banks.

  clocks:
    maxItems: 1
    description: Clock enabling the AES and SHA register banks and engines.

required:
  - compatible
  - reg
  - clocks

additionalProperties: false
