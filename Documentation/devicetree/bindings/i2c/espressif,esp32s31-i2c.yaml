%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/espressif,esp32s31-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 high-performance I2C controller

maintainers:
  - GrieferPig <noreply@example.com>

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    const: espressif,esp32s31-i2c

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  clock-frequency:
    default: 100000
    minimum: 50000
    maximum: 1000000

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - '#address-cells'
  - '#size-cells'

unevaluatedProperties: false

examples:
  - |
    i2c@20385000 {
        compatible = "espressif,esp32s31-i2c";
        reg = <0x20385000 0x200>;
        interrupts = <23 4>;
        clocks = <&clkc 25>;
        clock-frequency = <100000>;
        #address-cells = <1>;
        #size-cells = <0>;
    };
