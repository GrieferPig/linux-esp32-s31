%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/espressif,esp32s31-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 and ESP32-P4 I2C controllers

description: |
  ESP32-S31 and native ESP32-P4 rev1 HP I2C1 use Linux clock, reset and
  pinctrl resources. The retained P4 compatible describes HP I2C1 initialized
  by the revision-103 IDF
  display loader at 100 kHz on GPIO7 (SDA) and GPIO8 (SCL). Its clock and
  pad setup must remain enabled across handoff. Cold initialization is
  not supported by the retained compatible.

maintainers:
  - GrieferPig <noreply@example.com>

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#
  - if:
      properties:
        compatible:
          const: espressif,esp32p4-idf-i2c
    then:
      properties:
        clocks: false
        resets: false
        clock-frequency:
          const: 100000
    else:
      required:
        - clocks
  - if:
      properties:
        compatible:
          const: espressif,esp32p4-rev1-i2c
    then:
      required:
        - resets
        - pinctrl-0
        - pinctrl-names

properties:
  compatible:
    enum:
      - espressif,esp32s31-i2c
      - espressif,esp32p4-idf-i2c
      - espressif,esp32p4-rev1-i2c

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  espressif,param-name:
    $ref: /schemas/types.yaml#/definitions/string
    description: Property exposed by the overlay tool as a configurable scalar.
    const: clock-frequency

  espressif,param-values:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description: Allowed clock frequencies for the overlay tool.
    minItems: 1
    maxItems: 3

  clock-frequency:
    default: 100000
    minimum: 50000
    maximum: 1000000

required:
  - compatible
  - reg
  - interrupts
  - '#address-cells'
  - '#size-cells'

unevaluatedProperties: false

examples:
  - |
    i2c@20385000 {
        compatible = "espressif,esp32s31-i2c";
        reg = <0x20385000 0x200>;
        interrupts = <23 4>;
        clocks = <&clkc 25>;
        clock-frequency = <100000>;
        #address-cells = <1>;
        #size-cells = <0>;
    };
