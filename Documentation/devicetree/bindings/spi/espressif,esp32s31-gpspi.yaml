%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/espressif,esp32s31-gpspi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 general-purpose SPI controller

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

description: |
  The controller can switch between host and target through runtime overlays.
  Target mode keeps the base tree's address-cell count; changing it on a live
  node is rejected by OF overlay. The target child has no reg property.

allOf:
  - $ref: spi-controller.yaml#

properties:
  compatible:
    const: espressif,esp32s31-gpspi

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  dmas:
    minItems: 2
    maxItems: 2

  dma-names:
    items:
      - const: tx
      - const: rx

  espressif,gpio-cs-drive-strength:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: GPIO chip-select pad drive strength in mA.
    enum: [5, 10, 20, 40]

  espressif,max-data-lines:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Maximum controller data bus width.
    enum: [4, 8]

required:
  - compatible
  - reg
  - interrupts
  - clocks

unevaluatedProperties: false
...
