%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/espressif,esp32s31-gpspi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 general-purpose SPI controller

maintainers:
  - Espressif Linux Port Maintainers <linux-riscv@espressif.com>

allOf:
  - $ref: spi-controller.yaml#

properties:
  compatible:
    const: espressif,esp32s31-gpspi

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  dmas:
    maxItems: 1

  dma-names:
    items:
      - const: dma

  espressif,max-data-lines:
    enum: [4, 8]

required:
  - compatible
  - reg
  - interrupts
  - clocks

unevaluatedProperties: false
...
