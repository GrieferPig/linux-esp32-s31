%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/rohm,dh2228fv.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: SPI test endpoint used by the S31 peripheral fixture
maintainers:
  - S31 Linux contributors <s31-linux@localhost>
description: Existing spidev-compatible controller and target diagnostic endpoint.
allOf:
  - $ref: spi-peripheral-props.yaml#
  - if:
      properties:
        $nodename:
          const: slave
    then:
      properties:
        reg: false
    else:
      required:
        - reg
properties:
  compatible:
    const: rohm,dh2228fv
  reg:
    maxItems: 1
required:
  - compatible
unevaluatedProperties: false
