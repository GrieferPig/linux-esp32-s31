%YAML 1.2
---
$id: http://devicetree.org/schemas/net/espressif,esp32p4-dwmac.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-P4 Ethernet MAC with external RMII clock

maintainers:
  - GrieferPig <noreply@example.com>

allOf:
  - $ref: ethernet-controller.yaml#

properties:
  compatible:
    const: espressif,esp32p4-dwmac

  reg:
    maxItems: 1

  clocks:
    items:
      - description: EMAC bus clock
      - description: RMII PHY reference-derived clock
      - description: PTP timestamp clock

  clock-names:
    items:
      - const: stmmaceth
      - const: rmii
      - const: ptp_ref

  interrupts:
    items:
      - description: Ethernet MAC
      - description: Wake-on-LAN power management
      - description: Low-power idle

  interrupt-names:
    items:
      - const: macirq
      - const: eth_wake_irq
      - const: eth_lpi

  phy-mode:
    const: rmii

  snps,clk-csr:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: GMII address register clock-range selector.

  snps,aal:
    type: boolean
    description: Align AHB bursts to address boundaries.

  snps,pbl:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Programmable DMA burst length in beats.

  snps,no-pbl-x8:
    type: boolean
    description: Disable the eightfold DMA burst multiplier.

  mdio:
    $ref: mdio.yaml#

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - phy-mode

unevaluatedProperties: false
