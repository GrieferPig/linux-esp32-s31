%YAML 1.2
---
$id: http://devicetree.org/schemas/net/can/espressif,esp32-twai.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-P4 Classic CAN controller

maintainers:
  - GrieferPig <grieferpig@users.noreply.github.com>

allOf:
  - $ref: can-controller.yaml#

properties:
  compatible:
    const: espressif,esp32p4-twai

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets

unevaluatedProperties: false
